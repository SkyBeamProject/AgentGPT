name: Local agent

on:
  push:
    branches: ["main"]
    paths:
      - "local-agent/**"
      - ".github/workflows/local-agent.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "local-agent/**"
      - ".github/workflows/local-agent.yml"

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Install Windows packaging tools
        run: sudo apt-get update && sudo apt-get install -y nsis wixl wixl-data mingw-w64
      - name: Test and build installers
        working-directory: local-agent
        run: ./packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beam-agent-windows
          path: |
            local-agent/dist/beam-agent-windows-amd64.exe
            local-agent/dist/BeamAgentSetup.exe
            local-agent/dist/BeamAgent.msi
            local-agent/dist/SHA256SUMS
          if-no-files-found: error
